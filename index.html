<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunda Says | Shayari & Thoughts</title>
<meta name="description" content="Sunda Says — original shayari, thoughts and quotes by Nikhil Sunda.">
<meta name="author" content="Nikhil Sunda">
<meta name="theme-color" content="#08080a">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#08080a;
  color:#f5f5f5;
  font-family:Inter,sans-serif;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);
  top:-250px;
  left:-200px;
  pointer-events:none;
  z-index:-1;
}

body::after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.035),transparent 70%);
  right:-250px;
  bottom:-250px;
  pointer-events:none;
  z-index:-1;
}

/* NAVBAR */

nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:100;
  padding:20px;
  background:linear-gradient(rgba(8,8,10,.95),rgba(8,8,10,.45),transparent);
  backdrop-filter:blur(10px);
}

.nav-inner{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:14px;
  font-weight:600;
  letter-spacing:3px;
}

.nav-links{
  display:flex;
  gap:25px;
}

.nav-links a{
  color:#888;
  text-decoration:none;
  font-size:13px;
  transition:.3s;
}

.nav-links a:hover{
  color:white;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:120px 20px 80px;
  position:relative;
}

.hero-content{
  max-width:850px;
  animation:fadeUp 1.2s ease;
}

.eyebrow{
  color:#666;
  font-size:11px;
  letter-spacing:6px;
  text-transform:uppercase;
  margin-bottom:28px;
}

.hero h1{
  font-family:"DM Serif Display","Noto Serif Devanagari",serif;
  font-size:clamp(75px,17vw,155px);
  font-weight:400;
  line-height:.95;
  letter-spacing:-5px;
  background:linear-gradient(180deg,#fff 10%,#777 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero-text{
  margin-top:35px;
  color:#999;
  font-family:"Noto Serif Devanagari",serif;
  font-size:19px;
  line-height:2;
}

.scroll{
  position:absolute;
  bottom:35px;
  color:#555;
  font-size:10px;
  letter-spacing:5px;
  animation:bounce 2s infinite;
}

/* SECTIONS */

section{
  max-width:950px;
  margin:auto;
  padding:100px 20px;
}

.section-label{
  color:#666;
  font-size:10px;
  letter-spacing:5px;
  text-transform:uppercase;
}

.section-title{
  margin-top:8px;
  font-family:"DM Serif Display",serif;
  font-size:44px;
  font-weight:400;
}

/* SEARCH */

.search-box{
  margin-top:40px;
}

.search-box input{
  width:100%;
  padding:17px 20px;
  background:#0e0e11;
  border:1px solid #25252c;
  border-radius:14px;
  outline:none;
  color:white;
  font-size:14px;
}

.search-box input:focus{
  border-color:#555;
}

.search-box input::placeholder{
  color:#666;
}

/* FILTERS */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0 35px;
}

.filter{
  background:transparent;
  border:1px solid #28282e;
  color:#888;
  padding:10px 17px;
  border-radius:50px;
  cursor:pointer;
  font-size:12px;
  transition:.3s;
}

.filter:hover,
.filter.active{
  background:#eee;
  color:#111;
  border-color:#eee;
}

/* POETRY CARD */

.poetry-card{
  position:relative;
  background:linear-gradient(145deg,#131316,#0d0d10);
  border:1px solid #25252c;
  border-radius:20px;
  padding:35px;
  margin-bottom:22px;
  overflow:hidden;
  transition:.35s;
}

.poetry-card::before{
  content:"“";
  position:absolute;
  right:20px;
  top:-25px;
  font-family:Georgia,serif;
  font-size:140px;
  color:rgba(255,255,255,.025);
  pointer-events:none;
}

.poetry-card:hover{
  transform:translateY(-5px);
  border-color:#3c3c45;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.tag{
  display:inline-block;
  color:#666;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:20px;
}

.poetry{
  position:relative;
  font-family:"Noto Serif Devanagari",serif;
  font-size:23px;
  line-height:2;
  color:#eee;
}

.author{
  margin-top:25px;
  color:#777;
  font-size:12px;
  text-align:right;
}

/* ACTIONS */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:25px;
}

.action-btn{
  background:#0d0d10;
  border:1px solid #292930;
  color:#888;
  padding:9px 14px;
  border-radius:50px;
  font-size:12px;
  cursor:pointer;
  transition:.3s;
}

.action-btn:hover{
  color:white;
  border-color:#555;
}

.action-btn.liked{
  color:white;
  border-color:#777;
}

/* ABOUT */

.about-box{
  margin-top:35px;
  padding:45px 0;
  border-top:1px solid #25252c;
  border-bottom:1px solid #25252c;
}

.about-box p{
  max-width:760px;
  color:#aaa;
  font-family:"Noto Serif Devanagari",serif;
  font-size:18px;
  line-height:2;
}

/* SOCIAL */

.socials{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.social{
  text-decoration:none;
  color:#999;
  border:1px solid #292930;
  padding:11px 18px;
  border-radius:50px;
  font-size:12px;
  transition:.3s;
}

.social:hover{
  color:white;
  border-color:#555;
}

/* FOOTER */

footer{
  border-top:1px solid #202025;
  text-align:center;
  padding:50px 20px;
  color:#555;
  font-size:12px;
  line-height:1.8;
}

footer strong{
  color:#888;
}

/* ANIMATIONS */

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(8px)}
}

/* MOBILE */

@media(max-width:600px){

  nav{
    padding:17px 15px;
  }

  .brand{
    font-size:12px;
    letter-spacing:2.5px;
  }

  .nav-links{
    gap:14px;
  }

  .nav-links a{
    font-size:11px;
  }

  .hero{
    min-height:92vh;
  }

  .hero h1{
    font-size:82px;
    letter-spacing:-4px;
  }

  .hero-text{
    font-size:17px;
  }

  section{
    padding:75px 17px;
  }

  .section-title{
    font-size:36px;
  }

  .poetry-card{
    padding:27px 21px;
    border-radius:17px;
  }

  .poetry{
    font-size:19px;
    line-height:2;
  }

  .about-box p{
    font-size:17px;
  }
}
